name: Calendario y clasificación

on:
  schedule:
    # Viernes y domingo, dos veces cada día (14:00 y 15:00 UTC, que cubre
    # las 16:00 de Madrid tanto en horario de verano como de invierno).
    # No hay guarda de hora: GitHub retrasa los cron programados varias
    # horas y una guarda así descartaba la ejecución. Correr dos veces es
    # inocuo: la segunda no encuentra cambios y no commitea nada.
    - cron: "0 14,15 * * 5,0"
  workflow_dispatch:       # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador para el scraper
        run: npx playwright install --with-deps chromium

      - name: Extraer calendario y clasificación de la FBM
        run: npm run calendario

      - name: Guardar calendario.json si ha cambiado
        run: |
          git config user.name "calendario-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendario.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el calendario"
          else
            git commit -m "Actualiza calendario y clasificación"
            git push
          fi

      - name: Publicar la app en Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then echo "Sin SURGE_TOKEN: no se publica"; exit 0; fi
          mkdir -p dist
          cp index.html styles.css app.js manifest.webmanifest icon-512.png logo-chavalitros-trim.png sw.js calendario.json dist/
          npx --yes surge dist chavalitros-basket.surge.sh
