name: Calendario semanal

on:
  schedule:
    - cron: "0 7 * * 1"   # cada lunes a las 07:00 UTC
  workflow_dispatch:       # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador para el scraper
        run: npx playwright install --with-deps chromium

      - name: Extraer calendario de la FBM
        run: npm run calendario

      - name: Guardar calendario.json si ha cambiado
        run: |
          git config user.name "calendario-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendario.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el calendario"
          else
            git commit -m "Actualiza calendario"
            git push
          fi

      - name: Publicar la app en Surge
        if: ${{ secrets.SURGE_TOKEN != '' }}
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          mkdir -p dist
          cp index.html styles.css app.js manifest.webmanifest icon.svg sw.js calendario.json dist/
          npx --yes surge dist chavalitros-basket.surge.sh
