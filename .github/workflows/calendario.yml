name: Calendario y clasificación

on:
  schedule:
    # Cron va en UTC; Madrid es UTC+2 en verano y UTC+1 en invierno, así que
    # cada hora se programa en los dos horarios (algunas ejecuciones caen
    # una hora antes o después de lo pedido, según la época). No hay guarda
    # de hora: GitHub retrasa los cron varias horas y una guarda así
    # descartaba la ejecución. Correr de más es inocuo: si no hay cambios
    # no se commitea nada.
    # Viernes: ~16:00 Madrid.
    - cron: "0 14,15 * * 5"
    # Domingos, hora Madrid: 10:20, 11:35, 13:05, 14:05 y 15:20.
    - cron: "20 8,9 * * 0"         # 10:20
    - cron: "35 9,10 * * 0"        # 11:35
    - cron: "5 11,12,13 * * 0"     # 13:05 y 14:05
    - cron: "20 13,14 * * 0"       # 15:20
  workflow_dispatch:       # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador para el scraper
        run: npx playwright install --with-deps chromium

      - name: Extraer calendario y clasificación de la FBM
        run: npm run calendario

      - name: Guardar calendario.json si ha cambiado
        run: |
          git config user.name "calendario-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendario.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el calendario"
          else
            git commit -m "Actualiza calendario y clasificación"
            git push
          fi

      - name: Publicar la app en Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then echo "Sin SURGE_TOKEN: no se publica"; exit 0; fi
          mkdir -p dist
          cp index.html styles.css app.js manifest.webmanifest icon-512.png logo-chavalitros-trim.png sw.js calendario.json dist/
          npx --yes surge dist chavalitros-basket.surge.sh
